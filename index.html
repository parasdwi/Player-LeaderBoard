<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leader Board</title>
    <link rel="stylesheet" href="LeaderBoard.css">
</head>
<body>
    <h1 class="heading">Player's Leaderboard</h1>
    <div type="text" class="info">
        <input type="text" class="firstName" placeholder="First Name">
        <input type="text" class="lastName" placeholder="Last Name">
        <input type="text" class="country" placeholder="Country">
        <input type="text" class="score" placeholder="Score">
        <button class="addPlayer">Add Player</button>
    </div>
    <p class="required"></p>
    <div class="container"></div>
</body>
<script src="LeaderBoard.js"></script>
</html>
